[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interactive-surface"
version = "0.4.0"
description = "Local control server for interactive projection installations"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "psutil>=5.9,<9",
    "qrcode[pil]>=7.4,<9",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.8,<5",
    "PySide6>=6.6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
windows = ["pygrabber>=0.2; sys_platform == 'win32'"]

[project.scripts]
interactive-surface = "interactive_surface.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
interactive_surface = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
