<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive Surface · Виртуальный проектор</title><style>html,body{margin:0;width:100%;height:100%;background:#eef1ed;font:16px system-ui;color:#152439;overflow:hidden}svg{width:100vw;height:100vh;display:block}canvas{position:absolute;inset:0;width:100vw;height:100vh;display:none}text{font-family:system-ui;font-weight:750}.tip{position:absolute;bottom:10px;right:14px;color:#7a828f;font-size:12px}</style></head><body><svg id="board" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg><canvas id="game-canvas" aria-label="Игровая проекция"></canvas><div class="tip">Виртуальный проектор · Для тестов · F11 — полный экран браузера</div><script>
const params=new URLSearchParams(location.search);function readKey(){try{return sessionStorage.getItem('surfaceKey')||''}catch{return ''}}function saveKey(value){try{sessionStorage.setItem('surfaceKey',value);return true}catch{return false}}let token=params.get('token')||readKey();if(token&&saveKey(token)){const clean=new URL(location.href);clean.searchParams.delete('token');history.replaceState({},'',clean.pathname+clean.search+clean.hash)}const board=document.getElementById('board');const gameCanvas=document.getElementById('game-canvas');const gtx=gameCanvas.getContext('2d');let gameVisual=null,gameReceived=0;const P=p=>p.map(x=>x*1000).join(',');function draw(s){if(s.mode==='game'){board.style.display='none';gameCanvas.style.display='block';gameVisual=s;gameReceived=performance.now();return}board.style.display='block';gameCanvas.style.display='none';gameVisual=null;if(s.mode==='background'){board.innerHTML='<rect width="1000" height="1000" fill="'+(s.background==='white'?'white':'black')+'"/>';return;}if(s.mode==='ready'){document.body.style.background='#13283c';board.innerHTML='<rect width="1000" height="1000" fill="#152c42"/><text x="500" y="500" text-anchor="middle" font-size="90" fill="#abfbd4">ИГРА ГОТОВА</text>';return;}document.body.style.background='#eef1ed';const p=s.quad;if(s.mode==='identify'){board.innerHTML='<text x="500" y="520" text-anchor="middle" font-size="270">ВИРТУАЛЬНЫЙ</text>';return;}let items='<polygon points="'+p.map(P).join(' ')+'" fill="none" stroke="#476b73" stroke-width="4"/>';if(s.mode==='verify'&&s.grid){for(const line of s.grid){items+='<polyline points="'+line.map(P).join(' ')+'" stroke="#98a4ac" fill="none"/>'}}items+=p.map((x,i)=>'<circle cx="'+x[0]*1000+'" cy="'+x[1]*1000+'" r="14" fill="#e3475a"/><text x="'+(x[0]*1000+22)+'" y="'+(x[1]*1000-22)+'" font-size="37">'+(i+1)+'</text>').join('');board.innerHTML=items}

function projectorMap(quad){const [p0,p1,p2,p3]=quad;const dx1=p1[0]-p2[0],dx2=p3[0]-p2[0],dx3=p0[0]-p1[0]+p2[0]-p3[0];const dy1=p1[1]-p2[1],dy2=p3[1]-p2[1],dy3=p0[1]-p1[1]+p2[1]-p3[1];const d=dx1*dy2-dx2*dy1;const g=(dx3*dy2-dx2*dy3)/d,h=(dx1*dy3-dx3*dy1)/d;const a=p1[0]-p0[0]+g*p1[0],b=p3[0]-p0[0]+h*p3[0],c=p0[0],e=p1[1]-p0[1]+g*p1[1],f=p3[1]-p0[1]+h*p3[1],j=p0[1];return (x,y)=>{const z=g*x+h*y+1;return [(a*x+b*y+c)/z*gameCanvas.width,(e*x+f*y+j)/z*gameCanvas.height]}}
function warpedRing(map,x,y,r,fill,stroke,width){gtx.beginPath();for(let i=0;i<=48;i++){let a=i*Math.PI*2/48;const [px,py]=map(x+r*Math.cos(a)/1600,y+r*Math.sin(a)/1000);if(i)gtx.lineTo(px,py);else gtx.moveTo(px,py)}gtx.closePath();if(fill){gtx.fillStyle=fill;gtx.fill()}if(stroke){gtx.strokeStyle=stroke;gtx.lineWidth=width;gtx.stroke()}}
// Prefer the exact, unmodified original committed to GitHub. Keep legacy HQ
// and low-res portraits only as fallbacks when an older install lacks it.
const director = new Image();
const directorFiles = ['/assets/createch-director-original.png?v=original-1', '/assets/createch-director-hq.png?v=4', '/assets/createch-director.png?v=4', '/assets/createch-director.svg?v=4'];
let directorFileIndex = 0;
director.onerror = () => {directorFileIndex++; if(directorFileIndex < directorFiles.length)director.src = directorFiles[directorFileIndex]};
director.src = directorFiles[0];
if(params.has('showcase')){document.body.classList.add('showcase');document.querySelector('.tip').style.display='none'}

function createchPaint(map, state, dark, dpr) {
 const cc=gtx, pink='#f629bb', soft='#ff90de';
 const pt=(x,y)=>map(x/1600,y/1000);
 function path(coords, color, width=0, fill=null) {
   cc.beginPath();coords.forEach(([x,y],i)=>{const a=pt(x,y);i?cc.lineTo(...a):cc.moveTo(...a)});
   if(fill){cc.closePath();cc.fillStyle=fill;cc.fill()}
   if(width){cc.strokeStyle=color;cc.lineWidth=Math.max(1,width*dpr);cc.stroke()}
 }
 function word(t,x,y,size,color,align='left',weight='700') {
   const [px,py]=pt(x,y),scale=Math.hypot(...(()=>{const a=pt(0,0),b=pt(0,100);return[b[0]-a[0],b[1]-a[1]]})())/100;
   cc.font=weight+' '+Math.max(10,size*scale)+'px "DejaVu Sans",Arial,sans-serif';
   cc.textAlign=align;cc.fillStyle=color;cc.fillText(t,px,py);
 }
 cc.fillStyle=dark?'#0b0518':'#fff7fc';cc.fillRect(0,0,gameCanvas.width,gameCanvas.height);
 path([[62,25],[1538,25],[1570,57],[1570,944],[1541,976],[60,976],[30,944],[30,58],[62,25]],pink,3.5);
 path([[75,94],[575,94],[625,43]],pink,3.2);
 path([[1296,43],[1520,43]],'#a82d87',1.5);
 path([[70,934],[1030,934],[1050,922],[1518,922]],'#92166c',1.7);
 word('CREATECH / INTERACTIVE',82,77,21,'#ff4fc9');
 word('01 / INTERACTIVE PLAY',1513,75,16,'#c9a6c3','right','500');
 word('КРЕАТЕХ.',1515,902,70,pink,'right','900');
 word(String(state.score||0).padStart(2,'0')+' / '+String(state.target||5).padStart(2,'0'),84,164,32,dark?'#ffebf9':'#421935');
 if(state.demo){const stages={miss:'01 / СТИКЕР ПОВЁРНУТ НЕВЕРНО',turn:'02 / ПОВОРАЧИВАЕМ СТИКЕР',catch:'03 / БУКВЫ ЛЕТЯТ В ВЕДРО',return:'04 / МЕНЯЕМ УГОЛ'};word(stages[state.demo_stage]||'AUTO DEMO / СТИКЕР',1510,141,19,soft,'right');}
 else if(state.phase==='preview')word('PREVIEW / CREATECH',1510,141,19,soft,'right');

 const demoStickers=state.demo_stickers||[];
 for(const sticker of demoStickers){
   const pts=sticker.map(([x,y])=>[x*1600,y*1000]);
   path(pts,pink,3,'#5b174a');
   const upper=pts.slice(0,2);path(upper,'#fff3fd',2);
   const mx=(pts[0][0]+pts[1][0])/2,my=(pts[0][1]+pts[1][1])/2;
   word('СТИКЕР / ОТСКОК',mx,my-33,18,'#ff7bd5','center');
 }
 const goal=state.goal||[.25,.705,31.],gx=goal[0]*1600,gy=goal[1]*1000;
 if(['preview','playing','won'].includes(state.phase)){
    // Match createch_render.py: full-body source, bucket lip at (0.61,0.31).
    const w=207,h=276,x=gx-.61*w,y=gy-.31*h;
    const a=pt(x,y),b=pt(x+w,y),c=pt(x,y+h);
    if(director.complete&&director.naturalWidth){
      cc.save();cc.imageSmoothingEnabled=true;cc.imageSmoothingQuality='high';
      cc.transform((b[0]-a[0])/w,(b[1]-a[1])/w,
        (c[0]-a[0])/h,(c[1]-a[1])/h,a[0],a[1]);
      cc.drawImage(director,0,0,w,h);
      cc.restore();
    }else{
      path([[gx-32,gy-5],[gx+32,gy-5],[gx+25,gy+45],[gx-25,gy+45]],pink,2,'#79045e');
    }
    if(state.hits_fx>0)warpedRing(map,gx/1600,(gy+9)/1000,31+state.hits_fx*24,null,soft,Math.max(2,dpr*2));
 }
 const elapsed=Math.min(.04,Math.max(0,(performance.now()-gameReceived)/1000));
 for(const b of (state.balls||[])){
   const x=(b[0]+b[3]*elapsed)*1600,y=(b[1]+b[4]*elapsed)*1000,r=Math.min(30,Number(b[2]));
   if(y<120||y>940)continue;
   const scale=r/29,angle=((b[5]??0)*Math.PI/180);
   const rot=(ax,ay)=>[x+scale*(ax*Math.cos(angle)-ay*Math.sin(angle)),y+scale*(ax*Math.sin(angle)+ay*Math.cos(angle))];
   path([[-25,-21],[-13,-21],[-13,-4],[-7,-4],[7,-21],[22,-21],[3,-1],[21,20],[7,20],[-7,3],[-13,3],[-13,20],[-25,20]].map(([a,b])=>rot(a,b)),pink,0,pink);
   path([[27,9],[37,9],[37,20],[27,20]].map(([a,b])=>rot(a,b)),pink,0,pink);
 }
 if(state.phase==='won'){path([[325,365],[1275,365],[1275,620],[325,620]],pink,0,'#180920');word('ОТЛИЧНО!',800,485,72,soft,'center','900');const caption=state.settings?.cycle_mode==='manual'?'Новый раунд запускается с пульта':'Следующий раунд скоро начнётся';word(caption,800,565,28,'#ffebf9','center','500')}
}

function jumpPaint(map,state,dpr){
 const j=state.jump;if(!j)return;
 const theme=state.settings?.jump_theme||'cloud', palettes={
  cloud:['#e7f5f5','#b9e0e6','#26445b','#ffcb70','#79c9b6'],
  coffee:['#f4e6d1','#e1c7a4','#5d3b35','#d69b61','#b07a63'],
  neon:['#0c1230','#251d55','#f3f1ff','#f9c55c','#70e4d8']};
 const [bg1,bg2,ink,gold,accent]=palettes[theme]||palettes.cloud,cc=gtx;
 const P=(x,y)=>map(x/1600,y/1000);
 const polygon=(points,fill,stroke=null,sw=1)=>{
   cc.beginPath();points.forEach(([x,y],i)=>{const [a,b]=P(x,y);i?cc.lineTo(a,b):cc.moveTo(a,b)});
   cc.closePath();if(fill){cc.fillStyle=fill;cc.fill()}if(stroke){cc.strokeStyle=stroke;cc.lineWidth=sw*dpr;cc.stroke()}
 };
 const oval=(x,y,rx,ry,fill)=>{
   const pts=[];for(let i=0;i<=48;i++){const a=i*Math.PI/24;pts.push([x+rx*Math.cos(a),y+ry*Math.sin(a)])}
   polygon(pts,fill);
 };
 const text=(v,x,y,size,color,align='left',weight=700)=>{
   const [px,py]=P(x,y),[ax,ay]=P(0,0),[bx,by]=P(0,100);
   cc.font=weight+' '+Math.max(11,Math.hypot(bx-ax,by-ay)*size/100)+'px system-ui';
   cc.textAlign=align;cc.fillStyle=color;cc.fillText(String(v),px,py);
 };
 const grad=cc.createLinearGradient(0,0,0,gameCanvas.height);grad.addColorStop(0,bg1);grad.addColorStop(1,bg2);
 cc.fillStyle=grad;cc.fillRect(0,0,gameCanvas.width,gameCanvas.height);
 const offset=j.camera||0;
 for(let i=0;i<11;i++){
  const x=90+(i*307)%1550,y=((i*197+offset*.18)%1280)-140;
  if(theme==='neon'){warpedRing(map,x/1600,y/1000,24+(i%4)*12,null,'#5c4b9c',2*dpr)}
  else{
   const scale=.45+(i%3)*.24,col=theme==='cloud'?'#fff':'#fff3df';
   oval(x,y,90*scale,24*scale,col);oval(x-37*scale,y-13*scale,45*scale,34*scale,col);oval(x+15*scale,y-22*scale,58*scale,44*scale,col);
  }
 }
 if(j.finish_y>-130&&j.finish_y<1050){
  polygon([[240,j.finish_y-4],[1360,j.finish_y-4],[1360,j.finish_y+4],[240,j.finish_y+4]],accent);
  text('ФИНИШ',800,j.finish_y-28,44,ink,'center');
 }
 for(const coin of j.coins||[]){
  const {x,y,id}=coin;if(y<-65||y>1070)continue;
  const pulse=1+.09*Math.sin((j.elapsed||0)*5+id);
  oval(x,y,23*pulse,23*pulse,'#e6a94e');oval(x,y-2,19*pulse,19*pulse,gold);
  warpedRing(map,x/1600,(y-2)/1000,12*pulse,null,'#fff1b5',3*dpr);
  oval(x-6,y-8,4,2,'#fff7cf');
 }
 for(const sticker of j.stickers||[])polygon(sticker,theme==='cloud'?'#546e83':'#715b68','#ffffff',3);
 const [x,y,r,vx,vy]=j.hero||[800,700,30,0,0];
 if(y>-100&&y<1100){
  const body={cloud:'#f7ad8c',coffee:'#ba826a',neon:'#8e80ff'}[theme],
    shade={cloud:'#d77c79',coffee:'#85554a',neon:'#6655cb'}[theme];
  // Rotate the whole character around its centre, in world pixels.
  const angle=Math.max(-.26,Math.min(.26,vx*.00049));
  const transform=(px,py)=>[x+px*Math.cos(angle)-py*Math.sin(angle),y+px*Math.sin(angle)+py*Math.cos(angle)];
  const blob=(cx,cy,rx,ry,color)=>{
   const points=[];for(let i=0;i<=32;i++){const a=i*Math.PI/16;points.push(transform(cx+rx*Math.cos(a),cy+ry*Math.sin(a)))}
   polygon(points,color);
  };
  const bounce=j.bounce_fx||0,sy=1-.12*bounce,sx=1+.16*bounce;
  const b=(cx,cy,rx,ry,c)=>blob(cx,cy*sy,rx*sx,ry*sy,c);
  b(-16,-43,9,28,body);b(16,-45,9,29,body);
  b(-16,-46,3,18,shade);b(16,-47,3,18,shade);
  b(0,0,35,35,body);b(-19,31,13,7,shade);b(19,31,13,7,shade);
  b(-12,-2,3.5,5,'#322d40');b(12,-2,3.5,5,'#322d40');
  b(0,9,3.5,2.7,'#7d4652');b(-23,9,7,4,'#f28c96');b(23,9,7,4,'#f28c96');
  if(bounce>0)warpedRing(map,x/1600,(y+31)/1000,38+36*(1-bounce),null,'#fff5ce',Math.max(1,bounce*4*dpr));
 }
 if(j.coin_fx>0)text('+1',j.coin_fx_pos[0],j.coin_fx_pos[1]-60-(1-j.coin_fx)*30,34,gold,'center');
 polygon([[50,45],[390,45],[390,145],[50,145]],theme==='neon'?'#1e254c':'#fff');
 text('МОНЕТЫ',75,78,16,ink);text((state.score||0)+' / '+(j.total_coins||0),75,130,34,ink);
 polygon([[1170,50],[1535,50],[1535,140],[1170,140]],theme==='neon'?'#1e254c':'#fff');
 text('ВЫСОТА',1190,83,16,ink);
 polygon([[1190,98],[1510,98],[1510,111],[1190,111]],theme==='neon'?'#3b3862':'#d8e6e8');
 polygon([[1190,98],[1190+320*(j.progress||0),98],[1190+320*(j.progress||0),111],[1190,111]],accent);
 if(state.phase==='won'||state.phase==='lost'){
  polygon([[320,320],[1280,320],[1280,670],[320,670]],theme==='neon'?'#15243c':'#fff');
  text(state.phase==='won'?'УРОВЕНЬ ПРОЙДЕН!':'ПОПРОБУЕМ ЕЩЁ?',800,445,53,ink,'center');
  text('Собрано монет: '+(state.score||0)+' / '+(j.total_coins||0),800,530,32,ink,'center');
  text(state.settings?.jump_auto_restart?'Новый раунд начнётся автоматически':'Новый раунд запускается с пульта',800,602,23,ink,'center');
 }else if(state.phase==='preview')text('SKYHOP / ПРЕДПРОСМОТР',800,93,28,ink,'center');
}

function animateGame(){if(gameVisual){const s=gameVisual.game||{},a=s.settings||{},quad=gameVisual.quad;const rw=window.innerWidth,rh=window.innerHeight,dpr=Math.min(2,window.devicePixelRatio||1);const nw=Math.round(rw*dpr),nh=Math.round(rh*dpr);if(gameCanvas.width!==nw||gameCanvas.height!==nh){gameCanvas.width=nw;gameCanvas.height=nh}gtx.fillStyle=gameVisual.background==='white'?'#fff':'#000';gtx.fillRect(0,0,nw,nh);if(quad&&s.phase){const map=projectorMap(quad),dark=gameVisual.background!=='white',accent=dark?'#998aff':'#6d43a3',color=a.ball_color||'#70e9ff';if(s.game==='jump'){jumpPaint(map,s,dpr);requestAnimationFrame(animateGame);return;}if(a.theme==='createch'){createchPaint(map,s,dark,dpr);requestAnimationFrame(animateGame);return;}if(s.phase==='playing'||s.phase==='won'){const goal=s.goal||[.78,.72,45];warpedRing(map,goal[0],goal[1],goal[2]*1.14,dark?'#191127':'#eae3ff',accent,Math.max(2,dpr*4));warpedRing(map,goal[0],goal[1],goal[2]*.61,null,dark?'#c5bfff':'#705aa6',Math.max(1,dpr*2))}const seconds=Math.min(.035,Math.max(0,(performance.now()-gameReceived)/1000));for(const b of (s.balls||[])){const x=b[0]+b[3]*seconds,y=b[1]+b[4]*seconds,r=b[2];warpedRing(map,x,y,r,color,a.visual_style==='flat'?(dark?'#fff':'#1a3650'):color,Math.max(1,dpr));if(a.ball_design==='orbit')warpedRing(map,x,y,r*.58,null,'#fff',Math.max(1,dpr));if(a.ball_design==='comet'){const [px,py]=map(x,y),[qx,qy]=map(x-b[3]*.03,y-b[4]*.03);gtx.strokeStyle=color;gtx.lineWidth=3*dpr;gtx.beginPath();gtx.moveTo(px,py);gtx.lineTo(qx,qy);gtx.stroke()}}if(s.phase==='playing'){const [px,py]=map(.03,.06);gtx.fillStyle=dark?'#eff':'#234';gtx.font='bold '+Math.max(16,27*dpr)+'px system-ui';gtx.fillText(s.score+' / '+s.target,px,py)}if(s.phase==='won'){const [px,py]=map(.33,.5);gtx.fillStyle=dark?'#dbf8ff':'#243654';gtx.font='bold '+Math.max(24,60*dpr)+'px system-ui';gtx.fillText('ОТЛИЧНО!',px,py)}}}requestAnimationFrame(animateGame)}requestAnimationFrame(animateGame);

function connectionMessage(message){gameVisual=null;gameCanvas.style.display='none';board.style.display='block';board.innerHTML='';const label=document.createElementNS('http://www.w3.org/2000/svg','text');label.setAttribute('x','500');label.setAttribute('y','500');label.setAttribute('text-anchor','middle');label.setAttribute('font-size','24');label.textContent=message;board.appendChild(label)}
async function refreshSession(){
 const response=await fetch('/api/session',{cache:'no-store',headers:token?{'X-Control-Token':token}:{}});
 if(!response.ok)throw Error('Сервер недоступен: HTTP '+response.status);
 const session=await response.json();if(session.token){token=session.token;saveKey(token)}return session.authorized;
}
async function update(){
 try{
  if(!token&&!await refreshSession()){connectionMessage('Нет доступа — откройте QR');return}
  let headers={'X-Control-Token':token};
  let response=await fetch('/api/projector/visual',{headers,cache:'no-store'});
  if(response.status===401&&await refreshSession()){
   headers={'X-Control-Token':token};response=await fetch('/api/projector/visual',{headers,cache:'no-store'});
  }
  if(!response.ok){connectionMessage(response.status===401?'Нет доступа — откройте QR':'Ошибка проектора: HTTP '+response.status);return}
  const projection=await response.json();
  if(params.has('showcase')){
   // Reuse the game snapshot already returned with active projection.
   let state=projection.game;
   if(!state){const gameResponse=await fetch('/api/game/state',{headers,cache:'no-store'});if(!gameResponse.ok){connectionMessage('Не удалось загрузить игру');return}state=await gameResponse.json()}
   if(state.phase==='idle'&&state.game==='hole'&&state.settings?.theme==='createch'){
    state.phase='preview';state.goal=[.25,.705,31];
    state.balls=[[.43,.28,19,0,0,15],[.57,.47,19,0,0,90],[.37,.39,19,0,0,230]];
   }
   if(state.game==='jump'&&!state.jump){connectionMessage('Выберите Preview или запустите SkyHop');return}
   draw({...projection,mode:'game',quad:[[0,0],[1,0],[1,1],[0,1]],game:state});
  }else draw(projection);
 }catch(error){connectionMessage('Не удалось подключиться к проектору');console.warn('Projector preview update failed',error)}
 finally{setTimeout(update,130)}
}
update();
