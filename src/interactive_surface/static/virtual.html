<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive Surface · Виртуальный проектор</title><style>html,body{margin:0;width:100%;height:100%;background:#eef1ed;font:16px system-ui;color:#152439;overflow:hidden}svg{width:100vw;height:100vh;display:block}canvas{position:absolute;inset:0;width:100vw;height:100vh;display:none}text{font-family:system-ui;font-weight:750}.tip{position:absolute;bottom:10px;right:14px;color:#7a828f;font-size:12px}</style></head><body><svg id="board" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg><canvas id="game-canvas" aria-label="Игровая проекция"></canvas><div class="tip">Виртуальный проектор · Для тестов · F11 — полный экран браузера</div><script>
const params=new URLSearchParams(location.search);let token=params.get('token')||sessionStorage.getItem('surfaceKey')||'';if(token)sessionStorage.setItem('surfaceKey',token);history.replaceState({},'',location.pathname);const board=document.getElementById('board');const gameCanvas=document.getElementById('game-canvas');const gtx=gameCanvas.getContext('2d');let gameVisual=null,gameReceived=0;const P=p=>p.map(x=>x*1000).join(',');function draw(s){if(s.mode==='game'){board.style.display='none';gameCanvas.style.display='block';gameVisual=s;gameReceived=performance.now();return}board.style.display='block';gameCanvas.style.display='none';gameVisual=null;if(s.mode==='background'){board.innerHTML='<rect width="1000" height="1000" fill="'+(s.background==='white'?'white':'black')+'"/>';return;}if(s.mode==='ready'){document.body.style.background='#13283c';board.innerHTML='<rect width="1000" height="1000" fill="#152c42"/><text x="500" y="500" text-anchor="middle" font-size="90" fill="#abfbd4">ИГРА ГОТОВА</text>';return;}document.body.style.background='#eef1ed';const p=s.quad;if(s.mode==='identify'){board.innerHTML='<text x="500" y="520" text-anchor="middle" font-size="270">ВИРТУАЛЬНЫЙ</text>';return;}let items='<polygon points="'+p.map(P).join(' ')+'" fill="none" stroke="#476b73" stroke-width="4"/>';if(s.mode==='verify'&&s.grid){for(const line of s.grid){items+='<polyline points="'+line.map(P).join(' ')+'" stroke="#98a4ac" fill="none"/>'}}items+=p.map((x,i)=>'<circle cx="'+x[0]*1000+'" cy="'+x[1]*1000+'" r="14" fill="#e3475a"/><text x="'+(x[0]*1000+22)+'" y="'+(x[1]*1000-22)+'" font-size="37">'+(i+1)+'</text>').join('');board.innerHTML=items}

function projectorMap(quad){const [p0,p1,p2,p3]=quad;const dx1=p1[0]-p2[0],dx2=p3[0]-p2[0],dx3=p0[0]-p1[0]+p2[0]-p3[0];const dy1=p1[1]-p2[1],dy2=p3[1]-p2[1],dy3=p0[1]-p1[1]+p2[1]-p3[1];const d=dx1*dy2-dx2*dy1;const g=(dx3*dy2-dx2*dy3)/d,h=(dx1*dy3-dx3*dy1)/d;const a=p1[0]-p0[0]+g*p1[0],b=p3[0]-p0[0]+h*p3[0],c=p0[0],e=p1[1]-p0[1]+g*p1[1],f=p3[1]-p0[1]+h*p3[1],j=p0[1];return (x,y)=>{const z=g*x+h*y+1;return [(a*x+b*y+c)/z*gameCanvas.width,(e*x+f*y+j)/z*gameCanvas.height]}}
function warpedRing(map,x,y,r,fill,stroke,width){gtx.beginPath();for(let i=0;i<=48;i++){let a=i*Math.PI*2/48;const [px,py]=map(x+r*Math.cos(a)/1600,y+r*Math.sin(a)/1000);if(i)gtx.lineTo(px,py);else gtx.moveTo(px,py)}gtx.closePath();if(fill){gtx.fillStyle=fill;gtx.fill()}if(stroke){gtx.strokeStyle=stroke;gtx.lineWidth=width;gtx.stroke()}}
const director=new Image();director.src='/assets/createch-director.svg';
function createchPaint(map, state, dark, dpr){
const cc=gtx, pink='#f629bb', pale=dark?'#ffe2f7':'#3a1535';
const pt=(x,y)=>map(x/1600,y/1000);
function polygon(points,fill){cc.beginPath();points.forEach(([x,y],i)=>{const [a,b]=pt(x,y);if(i)cc.lineTo(a,b);else cc.moveTo(a,b)});cc.closePath();if(fill){cc.fillStyle=fill;cc.fill()}else cc.stroke()}
function line(points,color,width){cc.strokeStyle=color;cc.lineWidth=width*dpr;polygon(points,false)}
polygon([[0,0],[1600,0],[1600,1000],[0,1000]],dark?'#090613':'#fff5fc');
line([[240,45],[45,45],[45,160]],pink,4);
line([[1360,45],[1555,45],[1555,160]],pink,4);
line([[45,840],[45,955],[500,955]],pink,4);
line([[1130,955],[1555,955],[1555,840]],pink,4);
line([[55,100],[1545,100]],dark?'#7b235c':'#e7a1d5',1);
line([[55,900],[1545,900]],dark?'#7b235c':'#e7a1d5',1);
for(let x=100;x<1540;x+=96)line([[x,70],[x,78]],dark?'#79205b':'#e7a1d5',1);
const size=Math.max(11,Math.hypot(...(()=>{const a=pt(0,0),b=pt(0,65);return [b[0]-a[0],b[1]-a[1]]})()) );
function text(txt,x,y,px,color,weight='900',align='left'){const [xx,yy]=pt(x,y);cc.textAlign=align;cc.font=weight+' '+Math.max(11,px*size/65)+'px "Arial Black",system-ui,sans-serif';cc.fillStyle=color;cc.fillText(txt,xx,yy)}
text('CREATECH / INTERACTIVE',75,87,23,pink);
text('01 / PLAY',1510,87,18,pink,'700','right');
const [cx,cy]=pt(1480,935);text('КРЕАТЕХ.',1515,935,74,pink,'900','right');
const goal=state.goal||[.78,.72,45],gx=goal[0]*1600,gy=goal[1]*1000;
{
const p0=pt(gx-95,gy-156),px=pt(gx+95,gy-156),py=pt(gx-95,gy+99);
if(director.complete&&director.naturalWidth){
cc.save();cc.transform((px[0]-p0[0])/320,(px[1]-p0[1])/320,(py[0]-p0[0])/430,(py[1]-p0[1])/430,p0[0],p0[1]);cc.drawImage(director,0,0,320,430);cc.restore()
}else{const r=goal[2];polygon([[gx-r,gy],[gx+r,gy],[gx+r-8,gy+40],[gx-r+8,gy+40]],pink)}
}
const age=Math.min(.04,Math.max(0,(performance.now()-gameReceived)/1000));
for(const b of (state.balls||[])){
const x=(b[0]+b[3]*age)*1600,y=(b[1]+b[4]*age)*1000,r=Math.max(b[2],13)*1.45;
const shape=[[-24,-23],[-11,-23],[-11,-5],[-4,-5],[12,-23],[27,-23],[9,-1],[27,22],[11,22],[-3,5],[-11,5],[-11,22],[-24,22],[-24,4],[-13,4],[-13,-5],[-24,-5]];
const scale=r/27;polygon(shape.map(([a,b])=>[x+a*scale,y+b*scale]),pink);
polygon([[17,12],[30,12],[30,23],[17,23]].map(([a,b])=>[x+a*scale,y+b*scale]),pink);
}
text(String(state.score||0).padStart(2,'0')+' / '+String(state.target||5).padStart(2,'0'),75,165,30,pale);
if(state.phase==='preview')text('PREVIEW / THEME',75,870,20,pink);
if(state.demo)text('AUTO DEMO / SIMULATION',75,870,20,pink);
if(state.phase==='won'){
polygon([[450,380],[1150,380],[1150,540],[450,540]],'#120a23');
text('ПОЙМАНО!',800,490,67,pink,'900','center');
}
}
function animateGame(){if(gameVisual){const s=gameVisual.game||{},a=s.settings||{},quad=gameVisual.quad;const rw=window.innerWidth,rh=window.innerHeight,dpr=Math.min(2,window.devicePixelRatio||1);const nw=Math.round(rw*dpr),nh=Math.round(rh*dpr);if(gameCanvas.width!==nw||gameCanvas.height!==nh){gameCanvas.width=nw;gameCanvas.height=nh}gtx.fillStyle=gameVisual.background==='white'?'#fff':'#000';gtx.fillRect(0,0,nw,nh);if(quad&&s.phase){const map=projectorMap(quad),dark=gameVisual.background!=='white',accent=dark?'#998aff':'#6d43a3',color=a.ball_color||'#70e9ff';if(a.theme==='createch'){createchPaint(map,s,dark,dpr);requestAnimationFrame(animateGame);return;}if(s.phase==='playing'||s.phase==='won'){const goal=s.goal||[.78,.72,45];warpedRing(map,goal[0],goal[1],goal[2]*1.14,dark?'#191127':'#eae3ff',accent,Math.max(2,dpr*4));warpedRing(map,goal[0],goal[1],goal[2]*.61,null,dark?'#c5bfff':'#705aa6',Math.max(1,dpr*2))}const seconds=Math.min(.035,Math.max(0,(performance.now()-gameReceived)/1000));for(const b of (s.balls||[])){const x=b[0]+b[3]*seconds,y=b[1]+b[4]*seconds,r=b[2];warpedRing(map,x,y,r,color,a.visual_style==='flat'?(dark?'#fff':'#1a3650'):color,Math.max(1,dpr));if(a.ball_design==='orbit')warpedRing(map,x,y,r*.58,null,'#fff',Math.max(1,dpr));if(a.ball_design==='comet'){const [px,py]=map(x,y),[qx,qy]=map(x-b[3]*.03,y-b[4]*.03);gtx.strokeStyle=color;gtx.lineWidth=3*dpr;gtx.beginPath();gtx.moveTo(px,py);gtx.lineTo(qx,qy);gtx.stroke()}}if(s.phase==='playing'){const [px,py]=map(.03,.06);gtx.fillStyle=dark?'#eff':'#234';gtx.font='bold '+Math.max(16,27*dpr)+'px system-ui';gtx.fillText(s.score+' / '+s.target,px,py)}if(s.phase==='won'){const [px,py]=map(.33,.5);gtx.fillStyle=dark?'#dbf8ff':'#243654';gtx.font='bold '+Math.max(24,60*dpr)+'px system-ui';gtx.fillText('ОТЛИЧНО!',px,py)}}}requestAnimationFrame(animateGame)}requestAnimationFrame(animateGame);

async function update(){try{
const headers={'X-Control-Token':token};
const response=await fetch('/api/projector/visual',{headers});
if(!response.ok){board.innerHTML='<text x="100" y="100">Нет доступа — откройте QR</text>';return}
const projection=await response.json();
if(params.has('showcase')){
  const gameResponse=await fetch('/api/game/state',{headers});
  if(!gameResponse.ok)return;
  const state=await gameResponse.json();
  // A full-bleed, calibration-independent composition for the operator.
  // This affects ONLY the browser preview: hardware still uses the real quad.
  if(state.phase==='idle'&&state.settings?.theme==='createch'){
    state.phase='preview';
    state.balls=[[.31,.23,24,0,0],[.62,.31,24,0,0],[.44,.48,24,0,0]];
  }
  draw({...projection,mode:'game',quad:[[0,0],[1,0],[1,1],[0,1]],game:state});
}else draw(projection);
}catch(error){console.warn('Projector preview update failed',error)}
}update();setInterval(update,130);
</script></body></html>
