<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive Surface · Виртуальный проектор</title><style>html,body{margin:0;width:100%;height:100%;background:#eef1ed;font:16px system-ui;color:#152439;overflow:hidden}svg{width:100vw;height:100vh;display:block}text{font-family:system-ui;font-weight:750}.tip{position:absolute;bottom:10px;right:14px;color:#7a828f;font-size:12px}</style></head><body><svg id="board" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg><div class="tip">Виртуальный проектор · Для тестов · F11 — полный экран браузера</div><script>
const params=new URLSearchParams(location.search);let token=params.get('token')||sessionStorage.getItem('surfaceKey')||'';if(token)sessionStorage.setItem('surfaceKey',token);history.replaceState({},'',location.pathname);const board=document.getElementById('board');const P=p=>p.map(x=>x*1000).join(',');function draw(s){if(s.mode==='ready'){document.body.style.background='#13283c';board.innerHTML='<rect width="1000" height="1000" fill="#152c42"/><text x="500" y="500" text-anchor="middle" font-size="90" fill="#abfbd4">ИГРА ГОТОВА</text>';return;}document.body.style.background='#eef1ed';const p=s.quad;if(s.mode==='identify'){board.innerHTML='<text x="500" y="520" text-anchor="middle" font-size="270">ВИРТУАЛЬНЫЙ</text>';return;}let items='<polygon points="'+p.map(P).join(' ')+'" fill="none" stroke="#476b73" stroke-width="4"/>';if(s.mode==='verify'&&s.grid){for(const line of s.grid){items+='<polyline points="'+line.map(P).join(' ')+'" stroke="#98a4ac" fill="none"/>'}}items+=p.map((x,i)=>'<circle cx="'+x[0]*1000+'" cy="'+x[1]*1000+'" r="14" fill="#e3475a"/><text x="'+(x[0]*1000+22)+'" y="'+(x[1]*1000-22)+'" font-size="37">'+(i+1)+'</text>').join('');board.innerHTML=items}
async function update(){try{const r=await fetch('/api/projector/visual',{headers:{'X-Control-Token':token}});if(r.ok)draw(await r.json());else board.innerHTML='<text x="100" y="100">Нет доступа — откройте QR</text>'}catch{}}update();setInterval(update,130);
</script></body></html>
